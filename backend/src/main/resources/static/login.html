<!DOCTYPE html>
<html>
<head>
    <title>Connexion</title>
</head>
<body>
    <h1>Connexion</h1>
    <form id="loginForm" action="/login" method="post">
        <div>
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Se connecter</button>
    </form>

    <div id="message"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Empêche le formulaire de se soumettre normalement

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            fetch(`/api/users/login?email=${email}&password=${password}`)
                .then(response => response.text()) // Change response.json() en response.text()
                .then(message => { // Change data en message
                    document.getElementById('message').textContent = message; // Affiche le message
                })
                .catch(error => {
                    document.getElementById('message').textContent = 'Une erreur est survenue.';
                    console.error('Erreur :', error);
                });
        });
    </script>
</body>
</html>
